[package]
name = "burrow"
version = "0.1.0"
description = "Fast Windows PC cleaner, visual storage analyzer, app uninstaller, and live health monitor"
authors = ["Burrow"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
walkdir = "2.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
